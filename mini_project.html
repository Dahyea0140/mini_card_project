<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="card_project.css">
    <title>Card Project</title>
</head>

<body class="container">
    <header>
        <h1 class="header">Our Stuff</h1>
    </header>
    <nav>
        <a href="#profile1">Joe</a>
        <a href="#profile2">Jane</a>
        <a href="#profile3">Matt</a>
    </nav>
    <main>
        <article id="profile1" class="card">
            <figure>
                <img src="img/joe.png" alt="profile" title="profile pic" width="736" height="736">
                <figcaption>Joe Coder</figcaption>
            </figure>
            <p><q>I code Stuff.</q></p>
        </article>
        <article id="profile2" class="card">
            <figure>
                <img src="img/jane.png" alt="profile" title="profile pic" width="980 height=" 980">
                <figcaption>Jane <span class="nowrap">Del Rel</span></figcaption>
            </figure>
            <p><q>Production Desinger.</q></p>
        </article>
        <article id="profile3" class="card">
            <figure>
                <img src="img/matt.png" alt="profile" title="profile pic" width="735" height="1117">
                <figcaption>Matt Desinger</figcaption>
            </figure>
            <p><q>UI desinger.</q></p>
        </article>
    </main>
    <footer>
        <p>&copy; Acme Co.</p>
    </footer>


</body>

</html>
