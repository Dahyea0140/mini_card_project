<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="card_project.css">
    <title>Card Project</title>
</head>

<body class="container">
    <header>
        <h1 class="header">Our Stuff</h1>
    </header>
    <nav>
        <a href="#profile1">Joe</a>
        <a href="#profile2">Jane</a>
        <a href="#profile3">Matt</a>
    </nav>
    <main>
        <article id="profile1" class="card">
            <figure>
                <img src="img/image copy.png" alt="profile" title="profile pic" width="500" height="749">
                <figcaption>Joe Coder</figcaption>
            </figure>
            <p><q>I code Stuff.</q></p>
        </article>
        <article id="profile2" class="card">
            <figure>
                <img src="img/image copy.png" alt="profile" title="profile pic" width="500" height="749">
                <figcaption>Jane Production</figcaption>
            </figure>
            <p><q>Production Desinger.</q></p>
        </article>
        <article id="profile3" class="card">
            <figure>
                <img src="img/image copy.png" alt="profile" title="profile pic" width="500" height="749">
                <figcaption>Matt Desinger</figcaption>
            </figure>
            <p><q>UI desinger.</q></p>
        </article>

            <p class="matt_head">Matt Desinger</p>
            <figure class="pro_pic_1">
                <img src="img/image copy.png" alt="profile" title="profile pic" width="500" height="749">
                <figcaption class="pro_pic_caption">Matt Profile Pic</figcaption>
            </figure>
            <p class="matt_stuff">"I design Stuff"</p>
        </div> -->
    </main>
    <footer>
        <p>&copy; Acme Co.</p>
    </footer>


</body>

</html>
